name: deploy rmeme backend
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dabass2/rmeme-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Outside main (pull requests, manual runs) the image is only built, as a check.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          # Watchtower pulls the image and recreates the container, then reports back.
          resp=$(curl --fail-with-body --silent --show-error --max-time 300 -X POST \
            -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "https://leinad.dev/deploy/v1/update?image=$IMAGE")
          echo "$resp" | jq .
          if [ "$(echo "$resp" | jq '.summary.failed > 0 or .summary.scan_failed == true')" = true ]; then
            echo "::error::Watchtower could not update $IMAGE; see: docker compose logs watchtower"
            exit 1
          fi
          if [ "$(echo "$resp" | jq '.summary.updated')" = 0 ]; then
            echo "::warning::No container was updated (image unchanged, or no running container uses $IMAGE)"
          fi
